name: Actualizar datos

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # cada lunes a las 06:17 UTC

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - run: python -m scripts.descargar_datos
      - name: Guardar los datos si han cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Actualizar datos de Eurostat"
          git push
